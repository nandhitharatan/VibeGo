<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#064e3b"/>
  <!-- Bamboo Stalks -->
  <g stroke="#10b981" stroke-width="18" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="280" y1="0" x2="280" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- Wooden Tea Pagoda -->
  <polygon points="400,180 300,260 500,260" fill="#451a03"/>
  <rect x="330" y="260" width="140" height="120" fill="#78350f"/>
  <polygon points="400,320 280,400 520,400" fill="#451a03"/>
  <rect x="310" y="400" width="180" height="160" fill="#78350f"/>
  <!-- Lantern glow -->
  <circle cx="360" cy="460" r="16" fill="#fef08a"/>
  <circle cx="440" cy="460" r="16" fill="#fef08a"/>
</svg>
