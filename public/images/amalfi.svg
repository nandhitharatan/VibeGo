<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="aSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="aSea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aSky)"/>
  <!-- Sea -->
  <rect y="360" width="800" height="240" fill="url(#aSea)"/>
  <!-- Cliff side -->
  <path d="M0,200 Q200,280 350,380 L0,600 Z" fill="#475569"/>
  <!-- Mediterranean Archways / Villa -->
  <rect x="60" y="240" width="180" height="140" rx="12" fill="#f8fafc"/>
  <path d="M90,380 L90,310 A25,25 0 0,1 140,310 L140,380 Z" fill="#0f172a"/>
  <path d="M160,380 L160,310 A25,25 0 0,1 210,310 L210,380 Z" fill="#0f172a"/>
  <!-- Lemon tree greenery -->
  <circle cx="280" cy="340" r="50" fill="#15803d"/>
  <circle cx="290" cy="330" r="8" fill="#facc15"/>
  <circle cx="265" cy="355" r="7" fill="#facc15"/>
  <circle cx="305" cy="350" r="7" fill="#facc15"/>
  <!-- Sun reflections -->
  <ellipse cx="600" cy="420" rx="120" ry="8" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="580" cy="450" rx="90" ry="6" fill="#fef08a" opacity="0.4"/>
</svg>
