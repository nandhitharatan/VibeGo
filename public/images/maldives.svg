<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="mOcean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#mOcean)"/>
  <!-- Wooden Stilted Overwater Bungalow -->
  <rect x="250" y="220" width="300" height="160" fill="#78350f"/>
  <polygon points="400,100 220,220 580,220" fill="#451a03"/>
  <!-- Stilts -->
  <line x1="280" y1="380" x2="280" y2="520" stroke="#451a03" stroke-width="12"/>
  <line x1="360" y1="380" x2="360" y2="520" stroke="#451a03" stroke-width="12"/>
  <line x1="440" y1="380" x2="440" y2="520" stroke="#451a03" stroke-width="12"/>
  <line x1="520" y1="380" x2="520" y2="520" stroke="#451a03" stroke-width="12"/>
  <!-- Wooden Deck & Ladder into Lagoon -->
  <rect x="220" y="380" width="360" height="30" fill="#a16207"/>
  <!-- Coral & Manta ray shadow -->
  <ellipse cx="400" cy="520" rx="60" ry="24" fill="#0f172a" opacity="0.3"/>
</svg>
